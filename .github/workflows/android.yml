name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Read the pinned NDK version
        run: echo "NDK_VERSION=$(sed -n 's/^NDK_VERSION=//p' scripts/lib.sh)" >> "$GITHUB_ENV"

      - name: Install the NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;$NDK_VERSION" "platforms;android-36"

      # PJSIP and OpenSSL take a long time to compile and rarely change, so they are cached.
      - name: Restore the native libraries
        id: native
        uses: actions/cache@v6
        with:
          path: vendor/android
          key: android-native-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/lib.sh', 'scripts/build-android-native.sh', 'scripts/fetch-deps.sh', 'scripts/patches/**') }}

      - name: Build the native libraries (PJSIP + OpenSSL, 64-bit and 32-bit)
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          scripts/fetch-deps.sh
          scripts/build-android-native.sh arm64-v8a
          scripts/build-android-native.sh armeabi-v7a

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "L1ne-android-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: L1ne-android-debug
          path: L1ne-android-debug-*.apk
          if-no-files-found: error

      # The same native libraries, for the Windows and macOS build jobs below.
      - uses: actions/upload-artifact@v7
        with:
          name: android-native-libs
          path: vendor/android
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: android/**/build/reports

  # Proves the Gradle build itself works on Windows and macOS, using the libraries built above.
  apk-other-systems:
    name: APK on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the pinned NDK version
        run: echo "NDK_VERSION=$(sed -n 's/^NDK_VERSION=//p' scripts/lib.sh)" >> "$GITHUB_ENV"
      - name: Install the NDK
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; [ -f "$SM.bat" ] && SM="$SM.bat"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "ndk;$NDK_VERSION" "platforms;android-36"
      - uses: actions/download-artifact@v8
        with:
          name: android-native-libs
          path: vendor/android
      - uses: gradle/actions/setup-gradle@v6
      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: L1ne-android-debug
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "L1ne $GITHUB_REF_NAME" --notes-file .github/release-notes.md || true
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
