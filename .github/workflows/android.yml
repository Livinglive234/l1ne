name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional: build a signed release and put it in a DRAFT release with this tag name (for example v0.1.0)'
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # A release is a pushed tag like v0.1.0, or a manual run that was given a tag name. Everything else is an ordinary debug build.
      - name: Work out the version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; elif [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"; fi
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v0.1.0 or v0.1.0-rc1"; exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          # Android installs an APK over an older one only if its versionCode is higher; the run number only ever goes up.
          echo "L1NE_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          if [ -n "$TAG" ]; then echo "L1NE_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"; else echo "L1NE_VERSION_NAME=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"; fi

      - name: Signing key (releases only)
        if: env.RELEASE_TAG != ''
        env:
          KEYSTORE_B64: ${{ secrets.L1NE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.L1NE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.L1NE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.L1NE_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::The signing key secrets (L1NE_KEYSTORE_BASE64 and friends) are not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/l1ne-release.p12"
          {
            echo "L1NE_KEYSTORE=$RUNNER_TEMP/l1ne-release.p12"
            echo "L1NE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "L1NE_KEY_ALIAS=$KEY_ALIAS"
            echo "L1NE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Read the pinned NDK version
        run: echo "NDK_VERSION=$(sed -n 's/^NDK_VERSION=//p' scripts/lib.sh)" >> "$GITHUB_ENV"

      - name: Install the NDK
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "ndk;$NDK_VERSION" "platforms;android-36"

      # PJSIP and OpenSSL take a long time to compile and rarely change, so they are cached.
      - name: Restore the native libraries
        id: native
        uses: actions/cache@v6
        with:
          path: vendor/android
          key: android-native-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/lib.sh', 'scripts/build-android-native.sh', 'scripts/fetch-deps.sh', 'scripts/patches/**') }}

      - name: Build the native libraries (PJSIP + OpenSSL, 64-bit and 32-bit)
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          scripts/fetch-deps.sh
          scripts/build-android-native.sh arm64-v8a
          scripts/build-android-native.sh armeabi-v7a

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and APK
        working-directory: android
        run: |
          TASK=assembleDebug; [ -n "$RELEASE_TAG" ] && TASK=assembleRelease
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest ":app:$TASK"

      - name: Name the APK
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "L1ne-${RELEASE_TAG}-android.apk"
            # Show who signed it: the SHA-256 must stay the same for every release, or phones will refuse to update.
            "$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)apksigner" verify --print-certs "L1ne-${RELEASE_TAG}-android.apk" | grep -E "SHA-256|Verifies"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "L1ne-android-debug-${GITHUB_SHA::7}.apk"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: L1ne-android
          path: L1ne-*.apk
          if-no-files-found: error

      # The same native libraries, for the Windows and macOS build jobs below.
      - uses: actions/upload-artifact@v7
        with:
          name: android-native-libs
          path: vendor/android
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: android/**/build/reports

  # Proves the Gradle build itself works on Windows and macOS, using the libraries built above.
  apk-other-systems:
    name: APK on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Read the pinned NDK version
        run: echo "NDK_VERSION=$(sed -n 's/^NDK_VERSION=//p' scripts/lib.sh)" >> "$GITHUB_ENV"
      - name: Install the NDK
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; [ -f "$SM.bat" ] && SM="$SM.bat"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "ndk;$NDK_VERSION" "platforms;android-36"
      - uses: actions/download-artifact@v8
        with:
          name: android-native-libs
          path: vendor/android
      - uses: gradle/actions/setup-gradle@v6
      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

  # Puts the signed APK in a DRAFT release. Nothing is public until you open the draft on GitHub and press Publish.
  release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: L1ne-android
          path: dist
      - name: Draft the release and attach the APK
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="$INPUT_TAG"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "L1ne $TAG" --notes-file .github/release-notes.md || true
          gh release upload "$TAG" dist/*.apk --clobber
