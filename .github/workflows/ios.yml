name: iOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build the (unsigned) IPA
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      # PJSIP and OpenSSL take a long time to compile and rarely change, so the result is cached.
      - name: Restore the native libraries
        id: native
        uses: actions/cache@v6
        with:
          path: vendor/PJSIP.xcframework
          key: ios-native-${{ runner.arch }}-${{ hashFiles('scripts/lib.sh', 'scripts/build-openssl.sh', 'scripts/build-pjsip.sh', 'scripts/fetch-deps.sh', 'scripts/patches/**') }}

      - name: Build the native libraries (OpenSSL + PJSIP)
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          scripts/fetch-deps.sh
          scripts/build-openssl.sh
          scripts/build-pjsip.sh

      - name: Parser tests
        run: |
          swiftc -o /tmp/parsers L1ne/VCard.swift L1ne/Provisioning.swift L1ne/Account.swift L1ne/SystemContacts.swift L1ne/ContactsStore.swift tests/parsers/main.swift
          /tmp/parsers tests/fixtures

      - name: Generate the Xcode project
        run: scripts/gen.sh

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project L1ne.xcodeproj -scheme L1ne -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/L1ne.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package the IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/L1ne.xcarchive/Products/Applications/L1ne.app build/ipa/Payload/
          (cd build/ipa && zip -qry "../../L1ne-ios-unsigned-${GITHUB_SHA::7}.ipa" Payload)
          ls -la L1ne-ios-unsigned-*.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: L1ne-ios-unsigned
          path: L1ne-ios-unsigned-*.ipa
          if-no-files-found: error

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: L1ne-ios-unsigned
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "L1ne $GITHUB_REF_NAME" --notes-file .github/release-notes.md || true
          gh release upload "$GITHUB_REF_NAME" dist/*.ipa --clobber
