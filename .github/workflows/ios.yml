name: iOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional: put the unsigned IPA in the release with this tag name (for example v0.1.0-beta.1): a published pre-release when the tag has a suffix, a draft when it does not'
        required: false
        type: string

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build the (unsigned) IPA
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; elif [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"; fi
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v0.1.0 or v0.1.0-rc1"; exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          # CFBundleShortVersionString must be numeric (1.2.3); a suffix like -rc1 is dropped from it
          V="${TAG#v}"; echo "MARKETING_VERSION=${V%%-*}" >> "$GITHUB_ENV"
          [ -n "$TAG" ] || echo "MARKETING_VERSION=1.0" >> "$GITHUB_ENV"
          # what Settings shows, suffix included (0.1.0-beta.9)
          if [ -n "$TAG" ]; then echo "L1NE_VERSION_LABEL=${TAG#v}" >> "$GITHUB_ENV"; else echo "L1NE_VERSION_LABEL=1.0" >> "$GITHUB_ENV"; fi

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # needs only swiftc, so a failure shows up in a minute and not after the native build
      - name: Parser tests
        run: tests/parsers/run.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      # PJSIP and OpenSSL take a long time to compile and rarely change, so the result is cached.
      - name: Restore the native libraries
        id: native
        uses: actions/cache@v6
        with:
          path: vendor/PJSIP.xcframework
          key: ios-native-${{ runner.arch }}-${{ hashFiles('scripts/lib.sh', 'scripts/build-openssl.sh', 'scripts/build-pjsip.sh', 'scripts/fetch-deps.sh', 'scripts/patches/**') }}

      - name: Build the native libraries (OpenSSL + PJSIP)
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          scripts/fetch-deps.sh
          scripts/build-openssl.sh
          scripts/build-pjsip.sh

      - name: Generate the Xcode project
        run: scripts/gen.sh

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project L1ne.xcodeproj -scheme L1ne -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/L1ne.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$MARKETING_VERSION" L1NE_VERSION_LABEL="$L1NE_VERSION_LABEL" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package the IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/L1ne.xcarchive/Products/Applications/L1ne.app build/ipa/Payload/
          if [ -n "$RELEASE_TAG" ]; then NAME="L1ne-${RELEASE_TAG}-ios-unsigned.ipa"; else NAME="L1ne-ios-unsigned-${GITHUB_SHA::7}.ipa"; fi
          (cd build/ipa && zip -qry "../../$NAME" Payload)
          ls -la L1ne-*.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: L1ne-ios-unsigned
          path: L1ne-*.ipa
          if-no-files-found: error

  # Puts the unsigned IPA in the release for the tag (made by whichever of the Android and iPhone workflows finishes first; see scripts/make-release.sh).
  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: L1ne-ios-unsigned
          path: dist
      - name: Create the release and attach the IPA
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="$INPUT_TAG"; fi
          scripts/make-release.sh "$TAG" "$GITHUB_SHA"
          gh release upload "$TAG" dist/*.ipa --clobber
