name: L1ne
settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    # Lines to change when the paid team is ready (Team ID and bundle ID), then run: xcodegen generate
    DEVELOPMENT_TEAM: ${L1NE_TEAM_ID}      # set in your shell (export L1NE_TEAM_ID=XXXXXXXXXX); scripts/gen.sh defaults it to empty
    APP_ID: com.livenet.l1ne
options:
  bundleIdPrefix: com.livenet
  deploymentTarget:
    iOS: "17.0"
targets:
  L1ne:
    type: application
    platform: iOS
    sources: [L1ne]
    dependencies:
      - framework: vendor/PJSIP.xcframework     # built by scripts/build-pjsip.sh
        embed: false
    # Push Notifications (aps-environment) is left out for now: the free Personal Team can't sign it, and the app doesn't
    # register for push yet. Restore with the paid team:
    #   entitlements:
    #     path: L1ne/L1ne.entitlements
    #     properties:
    #       aps-environment: development    # production for TestFlight / App Store
    info:
      path: L1ne/Info.plist
      properties:
        UIBackgroundModes: [voip, audio, fetch]   # voip: PushKit + CallKit; audio: a call survives locking the screen; fetch: directory sync
        LSApplicationQueriesSchemes: [linphone, zoiper, groundwire]   # only to warn when another SIP app could share a line
        BGTaskSchedulerPermittedIdentifiers: [com.livenet.l1ne.directorysync]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true       # lets a CardDAV server on your own network use http
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_ID).config
            CFBundleURLSchemes: [l1ne-config, linphone-config]   # setup links, same shape as Linphone's
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: L1ne
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: L1ne needs the microphone for calls.
        INFOPLIST_KEY_NSCameraUsageDescription: L1ne uses the camera only to scan a setup QR code.
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ARCHS: arm64                                   # PJSIP is built for arm64 only (device + Apple-silicon simulator)
        EXCLUDED_ARCHS: x86_64
        OTHER_SWIFT_FLAGS: [-Xcc, -DPJ_AUTOCONF=1]     # same define the library was built with
        OTHER_LDFLAGS: [-lc++, -framework, Network, -framework, Security, -framework, AudioToolbox,
                        -framework, CoreAudio, -framework, AVFoundation, -framework, CFNetwork,
                        -framework, CoreMedia, -framework, CoreVideo, -framework, VideoToolbox]
