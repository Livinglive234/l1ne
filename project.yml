name: L1ne
settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    L1NE_VERSION_LABEL: "1.0"          # the version as shown in Settings, with the beta suffix (CI passes the tag); MARKETING_VERSION can only be numeric
    # Lines to change when the paid team is ready (Team ID and bundle ID), then run: xcodegen generate
    DEVELOPMENT_TEAM: ${L1NE_TEAM_ID}      # set in your shell (export L1NE_TEAM_ID=XXXXXXXXXX); scripts/gen.sh defaults it to empty
    APP_ID: com.livenet.l1ne
options:
  bundleIdPrefix: com.livenet
  deploymentTarget:
    iOS: "15.0"
targets:
  L1ne:
    type: application
    platform: iOS
    sources:
      - ios
      - path: native/zrtp                     # ZRTP media transport (C), compiled into the app; see native/zrtp/zrtp.h
        excludes: ["*.md"]
    dependencies:
      - framework: vendor/PJSIP.xcframework     # built by scripts/build-pjsip.sh
        embed: false
    # Push Notifications (aps-environment) is left out for now: the free Personal Team can't sign it, and the app doesn't
    # register for push yet. To turn it on (paid team, PushKit work in place): uncomment the block below, run
    # scripts/gen.sh, and check the App ID has the Push Notifications capability in the developer portal.
    #   entitlements:
    #     path: ios/L1ne.entitlements
    #     properties:
    #       aps-environment: development    # Xcode swaps this to production for archives (TestFlight / App Store) on its own
    # Also needed then: a push proxy holding the APNs key (see the push-proxy plan), and PushKit registration in CallKitManager.
    scheme:
      testTargets: [L1neTests, L1neUITests]     # so `xcodebuild test -scheme L1ne` runs them
    info:
      path: ios/Info.plist
      properties:
        L1neVersionLabel: $(L1NE_VERSION_LABEL)
        ITSAppUsesNonExemptEncryption: false   # only standard TLS / SRTP / DTLS (PJSIP + OpenSSL) and the OS Keychain; no custom crypto. Revisit if that changes.
        NSUserActivityTypes: [INStartCallIntent, INStartAudioCallIntent]   # call back from the Phone app's Recents
        UIBackgroundModes: [voip, audio, fetch]   # voip: PushKit + CallKit; audio: a call survives locking the screen; fetch: directory sync
        LSApplicationQueriesSchemes: [linphone, zoiper, groundwire]   # only to warn when another SIP app could share a line
        BGTaskSchedulerPermittedIdentifiers: [com.livenet.l1ne.directorysync]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true       # lets a CardDAV server on your own network use http
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_ID).config
            CFBundleURLSchemes: [l1ne-config, linphone-config]   # setup links, same shape as Linphone's
          - CFBundleURLName: $(APP_ID).sip
            CFBundleURLSchemes: [sip, sips]                      # sip: links open the keypad with the address filled in
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: L1ne
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: L1ne needs the microphone for calls.
        INFOPLIST_KEY_NSCameraUsageDescription: L1ne uses the camera only to scan a setup QR code.
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ARCHS: arm64                                   # PJSIP is built for arm64 only (device + Apple-silicon simulator)
        EXCLUDED_ARCHS: x86_64
        OTHER_SWIFT_FLAGS: [-Xcc, -DPJ_AUTOCONF=1]     # same define the library was built with
        OTHER_CFLAGS: [-DPJ_AUTOCONF=1]
        SWIFT_OBJC_BRIDGING_HEADER: ios/L1ne-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/native/zrtp", "$(SRCROOT)/vendor/openssl/ios-arm64/include"]
        OTHER_LDFLAGS: [-lc++, -framework, Network, -framework, Security, -framework, AudioToolbox,
                        -framework, CoreAudio, -framework, AVFoundation, -framework, CFNetwork,
                        -framework, CoreMedia, -framework, CoreVideo, -framework, VideoToolbox]

  # Tests (run with tests/mock/run-ios-wire-tests.sh and tests/ios/run-ui-tests.sh). The scheme is declared on the app target below.
  L1neTests:
    type: bundle.unit-test
    platform: iOS
    sources: [tests/ios/L1neTests]
    dependencies:
      - target: L1ne                       # hosted in the app: PJSIP can only start once per process, so the tests drive the app's own engine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.livenet.l1ne.tests
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
        OTHER_SWIFT_FLAGS: [-Xcc, -DPJ_AUTOCONF=1]     # the app's PJSIP headers come along with `@testable import L1ne`; same define the library was built with

  L1neUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [tests/ios/L1neUITests]
    dependencies:
      - target: L1ne
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.livenet.l1ne.uitests
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
